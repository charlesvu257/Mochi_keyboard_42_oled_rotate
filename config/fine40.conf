# config/fine40.conf
#
# The fine40 shield's Kconfig.defconfig already turns on the display and the
# EC11 encoder, so this file only adds what's missing.

# --- Mouse/pointing HID ---
# No longer strictly needed: the encoder now sends arrow keys, not &msc scroll.
# Kept ON deliberately, because toggling it changes the USB HID report
# descriptor, and Bluetooth hosts only re-read that after an unpair/re-pair.
# Leave it as-is to avoid re-pairing; set to n if you want the smaller build
# and don't mind re-pairing every paired host.
CONFIG_ZMK_POINTING=y

# --- OLED: NINO status screen ---
# The custom status screen and the NINO widget are selected by the shield's
# Kconfig.defconfig. The stock corner widgets are all off: NINO owns the whole
# panel, and leaving them on would only cost flash.
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_WIDGET_WPM_STATUS=n

# Idle blanking is left at its default (on for SSD1306). It is the only thing
# protecting the panel from burn-in during long writing sessions.

# Panel polarity has exactly one switch: CONFIG_NINO_INVERT. Expected: a dark
# panel with light pixels, inverting while Caps Lock is on. If it comes out the
# other way round on real hardware, set CONFIG_NINO_INVERT=y — do not reach for
# CONFIG_ZMK_DISPLAY_INVERT or the overlay's "inversion-on", which would
# reintroduce the double negative this was written to avoid.
#
# If the NINO splash reads upside down, that is the other quarter turn:
# CONFIG_NINO_PANEL_FLIP=y.
