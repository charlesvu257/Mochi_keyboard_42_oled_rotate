# config/fine40.conf
#
# The fine40 shield's Kconfig.defconfig already turns on the display and the
# EC11 encoder, so this file only adds what's missing.

# --- Encoder scroll: required for &msc (mouse scroll) ---
# NOTE: changes the USB HID report descriptor. Over Bluetooth the scroll will
# not work until the host re-reads it, i.e. until you unpair and re-pair.
CONFIG_ZMK_POINTING=y

# --- OLED: notetaker / typewriter loadout ---
CONFIG_ZMK_WIDGET_WPM_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Do NOT add CONFIG_ZMK_DISPLAY_INVERT here — fine40.overlay already sets
# "inversion-on" on the SSD1306, so this would invert it back.
